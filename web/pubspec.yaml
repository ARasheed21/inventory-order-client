name: inventory_web
description: Inventory & Order Management admin and warehouse web dashboard.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.7

dependencies:
  jaspr: ^0.22.0
  jaspr_router: ^0.8.1
  core:
    path: ../core
  http: ^1.2.0
  sentry: ^8.11.0
  fpdart: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  build_runner: ^2.10.0
  build_web_compilers: ^4.2.3
  jaspr_builder: ^0.22.0
  test: ^1.25.0
  jaspr_test: ^0.22.4

jaspr:
  mode: client

formatter:
  page_width: 100
  trailing_commas: preserve
