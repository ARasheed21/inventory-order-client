name: inventory_workspace

packages:
  - core
  - app
  - web

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    exec: dart analyze .
    description: Run the analyzer in every package.
  format:
    exec: dart format --set-exit-if-changed --output=none .
    description: Verify formatting in every package.
  test:
    exec: dart test
    packageFilters:
      dirExists: test
      dependsOn: "test"
    description: Run unit tests in pure Dart packages.
  flutter_test:
    exec: flutter test
    packageFilters:
      dependsOn: "flutter"
    description: Run widget tests in Flutter packages.
  build:
    exec: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      dependsOn: "build_runner"
    description: Run code generation (riverpod_generator) where configured.
